# SonarQube Cloud configuration for graph-theory-system-modeling.
#
# The analysis runs automatically (there is no scanner step in .github/workflows/ci.yml), so this
# file exists for one reason: to record, in the repository and under review, which findings were
# judged not to apply here and why. A rule switched off in a web UI is a decision nobody can read.
#
# Everything below is a decision about *threat model*, not about effort. Rules stay on wherever the
# code has an attacker.

sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/.venv/**,\
  applications/CodeMap/graph/pack/**

sonar.issue.ignore.multicriteria=cli1,cli2,cli3,rng,http1,http2,csrf,lock,deps

# ---------------------------------------------------------------------------------------------
# S8703 / S8705 / S8707 -- "SSRF / command argument injection / path traversal via faulty
# LLM-supplied CLI arguments", 28 findings across applications/CodeMap.
#
# These rules model a specific and real threat: an autonomous agent invents the arguments to a
# command-line tool, so the tool's argv is attacker-controlled and its path, URL and subprocess
# handling need the same care as a web request's.
#
# That is not what these files are. They are the offline plane described in
# applications/CodeMap/eval/ci/README.md -- export_pack, c1_dossiers, the bench harnesses, the
# rung runners -- run by hand, by the person who owns the machine, against their own graph pack.
# The arguments are things like `--out ../pack` and `--port 7345`. The "SSRF" sinks are
# urllib calls to a literal 127.0.0.1 with an operator-chosen port; the "path traversal" sinks are
# os.makedirs on the directory the operator asked to export into; the "command injection" sinks
# launch a local llama-server the operator already has on disk. There is no privilege boundary to
# cross: anyone who can pass these arguments can already open a shell.
#
# Jailing these paths would not add security, it would remove the feature -- pointing --out and
# --pack at arbitrary directories is the entire interface. The rules stay ON for the two things in
# this repository that do take input from somewhere else: applications/CodeMap/app/server.py and
# the two MCP servers.
sonar.issue.ignore.multicriteria.cli1.ruleKey=pythonsecurity:S8703
sonar.issue.ignore.multicriteria.cli1.resourceKey=applications/CodeMap/**/*.py
sonar.issue.ignore.multicriteria.cli2.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.cli2.resourceKey=applications/CodeMap/**/*.py
sonar.issue.ignore.multicriteria.cli3.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.cli3.resourceKey=applications/CodeMap/**/*.py

# ---------------------------------------------------------------------------------------------
# S2245 -- "make sure using this pseudorandom number generator is safe here", 5 findings in
# applications/CodeMap/training.
#
# random.Random(seed) is what makes a training split reproducible. datagen and dpo_pairs shuffle
# examples and sample negatives; the seed is published with the run so the split can be rebuilt.
# secrets would break exactly the property these files exist to have. Nothing here is a token, a
# key, a nonce or an id.
sonar.issue.ignore.multicriteria.rng.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.rng.resourceKey=applications/CodeMap/training/**/*.py

# ---------------------------------------------------------------------------------------------
# S5332 -- "using HTTP protocol is insecure", 2 findings.
#
# Both are loopback. server.py binds ThreadingHTTPServer to ("127.0.0.1", port) and prints the URL
# it just bound; embed_server.py does the same. A TLS certificate for 127.0.0.1 protects a channel
# that never leaves the kernel, at the cost of a certificate to manage and a warning to click past.
# If either ever binds 0.0.0.0, this exemption is wrong and should go.
sonar.issue.ignore.multicriteria.http1.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.http1.resourceKey=applications/CodeMap/app/server.py
sonar.issue.ignore.multicriteria.http2.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.http2.resourceKey=embeddings-service/embed_server.py

# ---------------------------------------------------------------------------------------------
# S4502 -- "make sure disabling CSRF protection is safe here", 1 finding, the Flask app in
# McpServerForEmbeddings.
#
# CSRF is an attack on ambient credentials: the browser attaches a cookie the user did not intend
# to send. This server has no cookies, no session and no login -- it is a stateless JSON API whose
# every request carries its own body and is answered the same way regardless of who asks. There is
# no ambient authority for a forged request to borrow. Adding CSRFProtect would require a token
# endpoint and a session store, i.e. inventing the state that makes the attack possible.
sonar.issue.ignore.multicriteria.csrf.ruleKey=python:S4502
sonar.issue.ignore.multicriteria.csrf.resourceKey=McpServerForEmbeddings/**/*.py

# ---------------------------------------------------------------------------------------------
# S8565 -- "dependency versions are not predictable if the lock file is not committed", on the two
# MCP servers' pyproject.toml.
#
# Both are libraries, published to PyPI with a name, a version, classifiers and
# requires-python >=3.10. The packaging convention is the other way round for libraries: an
# application commits a lock file so its one deployment is reproducible, a library declares ranges
# and is tested against them, because its consumers resolve alongside their own dependencies. A
# committed uv.lock here would pin nothing for anyone who installs the package, and would hide the
# upstream break that testing against the declared range is meant to catch.
sonar.issue.ignore.multicriteria.lock.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.lock.resourceKey=**/pyproject.toml

# ---------------------------------------------------------------------------------------------
# S8544 -- "using dependencies without locking resolved versions", on `pip install -e ".[dev]"`.
#
# Same reason, one step further: that line installs the package under test from its own metadata,
# and resolving the ranges it claims to support is part of what the job verifies. The rest of the
# job is pinned -- python 3.12, every action by commit sha, a fixed CPU wheel index, and since this
# commit the eval gate's pytest by exact version.
sonar.issue.ignore.multicriteria.deps.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.deps.resourceKey=.github/workflows/ci.yml
