# The Python side of the estate, on GitHub-hosted runners: the two MCP servers' unit tests (the model is
# mocked; tests marked slow or integration load it and stay out of CI), the CodeMap engine check when
# its graph pack is present (the pack is gitignored data; without it the step says so instead of failing),
# and the evaluation gate, which re-scores nine frozen model runs without running a model — the prompt
# contract, the scorer's arithmetic, the DSL grammar's verdicts and every published figure
# (applications/CodeMap/eval/ci/README.md explains why that is the half worth gating).
# JUnit XML from every suite feeds the same quality-metrics tool the other two repositories use, taken from
# a sparse checkout of the frontend repository, and lands on this repository's GitHub Pages site.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # CPU wheels: the runner has no GPU and the tests never load the model.
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  mcp:
    name: ${{ matrix.package }} (pytest, model mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [McpServerForEmbeddings, McpServerForReranking]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.package }}/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not slow and not integration" --junitxml=junit.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        if: always()
        with:
          name: junit-${{ matrix.package }}
          path: ${{ matrix.package }}/junit.xml
          retention-days: 30

  codemap:
    name: CodeMap engine check (needs the graph pack)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Engine check against the pack
        if: ${{ hashFiles('applications/CodeMap/graph/pack/entities.csv') != '' }}
        working-directory: applications/CodeMap/app
        run: python test_app.py
      - name: No pack in this checkout
        if: ${{ hashFiles('applications/CodeMap/graph/pack/entities.csv') == '' }}
        run: |
          echo "applications/CodeMap/graph/pack/ is not in the repository (exported data, gitignored)." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "The engine check runs where the pack exists; a committed fixture pack would make it run here." | tee -a "$GITHUB_STEP_SUMMARY"

  eval-gate:
    name: Evaluation gate (frozen runs re-scored)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      # Pinned: the gate replays frozen artifacts and must give the same verdict a year from
      # now. A floating pytest is the one input that could change the answer (sonar S8544).
      - run: python -m pip install pytest==9.1.1
      - name: Re-score the frozen model runs
        working-directory: applications/CodeMap/eval/ci
        run: python -m pytest -q --junitxml=junit.xml
      - name: The ladder, re-derived
        if: always()
        working-directory: applications/CodeMap/eval/ci
        run: |
          set -o pipefail
          python harness.py --summary | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        if: always()
        with:
          name: junit-eval-gate
          path: applications/CodeMap/eval/ci/junit.xml
          retention-days: 30

  report:
    name: Quality metrics, Pages
    needs: [mcp, codemap, eval-gate]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: Check-It-Out-Dev/checkitout-frontend
          path: frontend
          # tools/lib too: the shared scripts import the ordering comparator from it, and a
          # checkout of tools/ci alone fails at import time with ERR_MODULE_NOT_FOUND.
          sparse-checkout: |
            tools/ci
            tools/lib
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          path: results
      - name: Pages site (previous state)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: gh-pages
          path: site
        continue-on-error: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 24
      - name: Quality metrics into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p site && rm -rf site/.git
          STARTED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          DURATION=$(( $(date +%s) - $(date -d "$STARTED_AT" +%s) ))
          node frontend/tools/ci/quality-metrics.mjs --out site --workflow ci --started-at "$STARTED_AT" --duration-sec "$DURATION" \
            --junit 'results/junit-McpServerForEmbeddings/*.xml:embeddings-mcp' \
            --junit 'results/junit-McpServerForReranking/*.xml:reranker-mcp' \
            --junit 'results/junit-eval-gate/*.xml:eval-gate' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        # Pinned to the commit v4 pointed at: a tag is a moving reference, and this action
        # runs with a token that can write to the Pages branch (actions/unpinned-tag).
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: false
          commit_message: "ci run ${{ github.run_number }}"
