# Static security analysis on every push and pull request, plus a weekly sweep so a rule added upstream
# reaches this code without waiting for someone to touch it.
#
# Why this file exists: on 2026-09-09 a real credential was found sitting in the public backend's Cucumber
# corpus, in 54 files, because nothing was looking for it. The same blind spot covered this repository. Secret scanning and push protection are an
# organisation setting and are enabled there; this workflow is the part that lives in the repository —
# CodeQL over the application code and a dependency review on incoming pull requests.
name: code-scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 04:10 UTC, well clear of the nightly at 02:00 and the k8s tier.
    - cron: "10 4 * * 1"
  workflow_dispatch:

concurrency:
  group: code-scanning-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # The Angular application and every tool under tools/ and e2e-tests/ are one JS/TS database;
        # `actions` covers the workflow files themselves (injection through untrusted run inputs).
        language: [python, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-extended adds the rules that are precise but slower; this repository is small enough.
          queries: security-extended
      # Python needs no build step; CodeQL reads it from source.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    # Only pull requests have a base and a head to compare; on a push there is nothing to review.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5
        with:
          # A pull request may not introduce a dependency with a known high severity advisory.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
