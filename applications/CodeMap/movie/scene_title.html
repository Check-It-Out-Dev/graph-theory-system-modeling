<!doctype html><meta charset="utf-8"><title>CodeMap</title>
<style>
  :root{--bg:#0e1116;--text:#fbf9f4;--dim:#98a2b0;--accent:#ff5a36;--dsl:#fcd34d}
  *{margin:0;box-sizing:border-box}
  body{background:var(--bg);height:100vh;display:flex;flex-direction:column;
       align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;
       color:var(--text);overflow:hidden}
  .logo{font-size:7.2rem;font-weight:300;letter-spacing:-.02em;opacity:0;
        animation:up 1.1s .3s cubic-bezier(.2,.7,.3,1) forwards}
  .logo b{font-weight:800}
  .logo .v{color:var(--dim);font-size:2.4rem;font-weight:400;vertical-align:.62em;
           margin-left:.55rem}
  .motto{margin-top:1.6rem;font-size:2.35rem;font-weight:600;opacity:0;
         animation:up 1.1s .9s cubic-bezier(.2,.7,.3,1) forwards}
  .motto b{color:var(--accent)}
  .sub{margin-top:.7rem;font-size:1.6rem;color:var(--dim);font-style:italic;opacity:0;
       animation:up 1.1s 1.35s cubic-bezier(.2,.7,.3,1) forwards}
  .stats{margin-top:3.4rem;display:flex;gap:2.6rem;opacity:0;
         animation:up 1.1s 1.9s cubic-bezier(.2,.7,.3,1) forwards}
  .s{border:1px solid #262d38;border-radius:12px;padding:.9rem 1.6rem;text-align:center;
     background:#151922}
  .s .n{font-size:1.9rem;font-weight:700;color:var(--dsl)}
  .s .l{font-size:1.02rem;color:var(--dim);margin-top:.15rem}
  @keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
</style>
<div class="logo"><b>Code</b>Map<span class="v">navigator v1</span></div>
<div class="motto">Przenosimy inteligencję <b>z wag modelu do struktury danych</b>.</div>
<div class="sub">We move the intelligence out of model weights — and into the data structure.</div>
<div class="stats">
  <div class="s"><div class="n">430k LOC</div><div class="l">production codebase</div></div>
  <div class="s"><div class="n">4B → 80B</div><div class="l">local navigators, plain CPU</div></div>
  <div class="s"><div class="n">13 verbs + Cypher</div><div class="l">graph DSL, µs each</div></div>
  <div class="s"><div class="n">~$25</div><div class="l">one night of training</div></div>
</div>
<script>setTimeout(() => { window.__done = true; }, 5200);</script>
