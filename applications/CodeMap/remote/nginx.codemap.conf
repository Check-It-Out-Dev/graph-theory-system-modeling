# codemap.checkitout.app — the remote MCP behind the host nginx (installed by tools/deploy.sh into
# /etc/nginx/sites-available and linked into sites-enabled). DNS-only at Cloudflare: a navigator turn
# can take a minute, longer than the proxy's timeout. The bearer check happens in the app; nginx
# adds rate limits (the host's cio_* zones) and the usual headers.
server {
    listen 80;
    server_name codemap.checkitout.app;
    location /.well-known/acme-challenge/ { root /var/www/le; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name codemap.checkitout.app;
    ssl_certificate /etc/letsencrypt/live/codemap.checkitout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codemap.checkitout.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/codemap.checkitout.app.access.log;
    limit_conn cio_conn_ip 20;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 256k;

    location = /healthz { proxy_pass http://127.0.0.1:7345/healthz; access_log off; }
    location / {
        limit_req zone=cio_general burst=30 nodelay;
        proxy_pass http://127.0.0.1:7345;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
    location ~ /\. { deny all; access_log off; log_not_found off; }
}
